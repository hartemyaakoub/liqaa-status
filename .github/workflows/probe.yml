name: Probe

on:
  schedule:
    # Asking for */5 does not produce */5. Across the 137 snapshots already in
    # results/, the median gap between runs was 90 minutes — GitHub drops
    # scheduled runs under load and never makes them up. */30 is requested here
    # because a cadence that is missed nineteen times out of twenty is a claim,
    # not a schedule.
    - cron: '*/30 * * * *'
  workflow_dispatch:        # allow manual triggers

permissions:
  contents: write           # needed to commit results

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run probes
        run: node probes/run.mjs

      - name: Commit results
        run: |
          git config user.name "liqaa-probe[bot]"
          git config user.email "probe@liqaa.io"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Two probes finishing close together both push; without the rebase the
          # loser drops its snapshot on the floor and the gap looks like downtime.
          for i in 1 2 3; do
            git pull --rebase -q origin HEAD && git push && break
            echo "push retry $i"; sleep 3
          done
